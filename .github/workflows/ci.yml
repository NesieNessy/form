# Build, test and end-to-end test on every push and pull request.
#
# No secrets are used: the app is built in local mode (no Supabase), so the
# end-to-end tests never sign in, sync or call the assistant, and CI spends
# nothing on AI. The paid assistant evaluation (`npm run eval`) stays manual.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests plus the real migrations in an in-process Postgres (PGlite).
      - name: Unit and database tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      # Job logs need a login; annotations do not, so failures are reported as annotations too.
      - name: Report failing tests
        if: failure()
        run: |
          grep -nE "✖|AssertionError|Error:|expected|actual" test-output.txt | head -40 | while IFS= read -r line; do echo "::error title=npm test::${line}"; done

  e2e:
    name: Web build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the web app (local mode)
        run: npm run e2e:build
      - run: npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
